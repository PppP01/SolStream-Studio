name: Build SolStream Studio APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout SolStream Studio Source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Update SDK Manager & Preload Android Platforms
        run: |
          sdkmanager --update || true
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-36" || true
          sdkmanager "platforms;android-37" || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Official Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Signed Release (R8 Shrunk) & Debug APKs
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease -x lint -x lintVitalRelease -Pandroid.suppressUnsupportedCompileSdk=36,37 --no-daemon --stacktrace

      - name: Upload SolStream Studio Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SolStream-Studio-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload SolStream Studio Debug Fallback APK
        uses: actions/upload-artifact@v4
        with:
          name: SolStream-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Releases (When Tagged v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

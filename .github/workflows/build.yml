name: Build SolStream Studio APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout SolStream Studio Source
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pinned Android SDK, NDK 28.2.13676358 & CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          PINNED_NDK="28.2.13676358"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-36" "cmake;3.22.1" > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null || "$SDKMANAGER" --install "platforms;android-37" > /dev/null || true
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
            sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/' "$SDK_ROOT/platforms/android-37.0/source.properties" || true
          fi
          if [ ! -d "$SDK_ROOT/ndk/$PINNED_NDK" ]; then
            "$SDKMANAGER" --install "ndk;$PINNED_NDK" > /dev/null
          fi
          echo "Using pinned NDK version: $PINNED_NDK"
          echo "SOL_NDK_VERSION=$PINNED_NDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Fetch & Verify Pinned Xiph RNNoise v0.1.1 Commit (Strict Neural Check)
        run: |
          PINNED_COMMIT="6cbfd53eb348a8d394e0757b4025c6ded34eb2b6"
          rm -rf app/src/main/cpp/rnnoise
          mkdir -p app/src/main/cpp/rnnoise
          cd app/src/main/cpp/rnnoise
          git init -q
          git fetch --depth 1 https://github.com/xiph/rnnoise.git "$PINNED_COMMIT" \
            || git fetch --depth 1 https://gitlab.xiph.org/xiph/rnnoise.git "$PINNED_COMMIT"
          git checkout -q --detach FETCH_HEAD
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$PINNED_COMMIT" ]; then
            echo "::error::RNNoise commit mismatch! Expected $PINNED_COMMIT but got $ACTUAL_COMMIT"
            exit 1
          fi
          rm -rf .git
          cd - > /dev/null
          for REQ_FILE in "src/denoise.c" "src/rnn.c" "src/rnn_data.c" "src/pitch.c" "src/kiss_fft.c" "src/celt_lpc.c" "include/rnnoise.h"; do
            if [ ! -s "app/src/main/cpp/rnnoise/$REQ_FILE" ]; then
              echo "::error::Missing required official Xiph RNNoise source file: $REQ_FILE"
              exit 1
            fi
          done
          echo "✅ Verified pinned Xiph RNNoise v0.1.1 commit $ACTUAL_COMMIT (SOL_USE_XIPH_RNNOISE=1)."

      - name: Set up Official Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Run Fresh Unit Tests, Strict Lint & Compile Signed Release APK + Play Store AAB (Kotlin + C NDK)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SOL_REQUIRE_XIPH_RNNOISE: "true"
        run: |
          gradle testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --rerun-tasks -Pandroid.suppressUnsupportedCompileSdk=36,37,37.0,38,38.0 --no-daemon --stacktrace

      - name: Verify Release Signature, 16 KB APK Zipalign, All-*.so ELF Alignment (APK + AAB) & Stage Artifacts
        env:
          HAS_RELEASE_SECRET: ${{ secrets.SIGNING_KEY_BASE64 != '' }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_DIR="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APP_VER="$(grep 'versionName =' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          APP_VER="${APP_VER:-1.5.2}"
          REL_APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          CERT_INFO="$("$APKSIGNER" verify --verbose --print-certs "$REL_APK")"
          echo "$CERT_INFO"
          if [ "$HAS_RELEASE_SECRET" = "true" ] && echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK was signed with a Debug key! Check GitHub Secrets."
            exit 1
          fi
          echo "=== Verifying 16 KB APK Zip Alignment ==="
          "$ZIPALIGN" -c -P 16 -v 4 "$REL_APK" | tail -n 15

          verify_elf_16kb() {
            local LABEL="$1"
            local LIB_ROOT="$2"
            for ABI in arm64-v8a x86_64; do
              local SO_COUNT=0
              for SO_FILE in "$LIB_ROOT/$ABI"/*.so; do
                [ -f "$SO_FILE" ] || continue
                SO_COUNT=$((SO_COUNT + 1))
                local LOAD_INFO
                LOAD_INFO="$(readelf -lW "$SO_FILE" | grep 'LOAD')"
                echo "=== [$LABEL] $ABI $(basename "$SO_FILE") ELF LOAD Segments ==="
                echo "$LOAD_INFO"
                while read -r ALIGN; do
                  [ -z "$ALIGN" ] && continue
                  if (( $((ALIGN)) < 16384 )); then
                    echo "::error::[$LABEL] $ABI $(basename "$SO_FILE") has <16KB ELF LOAD alignment ($ALIGN)!"
                    exit 1
                  fi
                done < <(echo "$LOAD_INFO" | awk '{print $NF}')
              done
              if [ "$SO_COUNT" -eq 0 ]; then
                echo "::error::[$LABEL] No native .so libraries found for $ABI!"
                exit 1
              fi
            done
          }

          rm -rf /tmp/apk_so_check && mkdir -p /tmp/apk_so_check
          unzip -q "$REL_APK" "lib/*" -d /tmp/apk_so_check
          verify_elf_16kb "Release APK" "/tmp/apk_so_check/lib"

          REL_AAB="$(ls app/build/outputs/bundle/release/*.aab | head -1 || true)"
          if [ -z "$REL_AAB" ] || [ ! -f "$REL_AAB" ]; then
            echo "::error::Release Play Store .aab was not generated!"
            exit 1
          fi
          rm -rf /tmp/aab_so_check && mkdir -p /tmp/aab_so_check
          unzip -q "$REL_AAB" "base/lib/*" -d /tmp/aab_so_check
          verify_elf_16kb "Play Store AAB" "/tmp/aab_so_check/base/lib"

          mkdir -p dist/release dist/debug dist/bundle
          cp "$REL_APK" "dist/release/SolStream-Studio-v${APP_VER}.apk"
          DBG_APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$DBG_APK" "dist/debug/SolStream-Studio-v${APP_VER}-debug.apk"
          cp "$REL_AAB" "dist/bundle/SolStream-Studio-v${APP_VER}-PlayStore.aab"

      - name: Upload SolStream Studio Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SolStream-Studio-Release-APK
          path: dist/release/*.apk

      - name: Upload SolStream Studio Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: SolStream-Studio-PlayStore-AAB
          path: dist/bundle/*.aab

      - name: Upload SolStream Studio Debug Fallback APK
        uses: actions/upload-artifact@v4
        with:
          name: SolStream-Studio-Debug-APK
          path: dist/debug/*.apk

      - name: Upload Gradle Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SolStream-Lint-Report
          path: app/build/reports/lint-results-debug.html

      - name: Publish APK & AAB to GitHub Releases (When Tagged v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.apk
            dist/bundle/*.aab
